name: Huckleberry read-only sync
on:
  workflow_dispatch:
  push:
    branches: [feature/neon-family-auth]
    paths:
      - ".github/workflows/huckleberry-sync.yml"
      - "scripts/sync_huckleberry.py"
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  id-token: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install huckleberry-api==0.4.7 aiohttp
      - name: Request GitHub OIDC token for protected Vercel preview
        id: vercel_oidc
        shell: bash
        run: |
          token_response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${token_response}")"
          echo "::add-mask::${oidc_token}"
          echo "token=${oidc_token}" >> "${GITHUB_OUTPUT}"
      - run: python scripts/sync_huckleberry.py
        env:
          HUCKLEBERRY_EMAIL: ${{ secrets.HUCKLEBERRY_EMAIL }}
          HUCKLEBERRY_PASSWORD: ${{ secrets.HUCKLEBERRY_PASSWORD }}
          HUCKLEBERRY_CHILD_UID: ${{ secrets.HUCKLEBERRY_CHILD_UID }}
          HUCKLEBERRY_CHILD_NAME: ${{ secrets.HUCKLEBERRY_CHILD_NAME }}
          ZADE_SYNC_URL: ${{ secrets.ZADE_SYNC_URL }}
          ZADE_SYNC_TOKEN: ${{ secrets.ZADE_SYNC_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
