name: Dashboard tests
on:
  push:
    branches: [feature/neon-family-auth]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEON_AUTH_BASE_URL: https://auth.fixture.invalid
          NEON_AUTH_COOKIE_SECRET: fixture-cookie-secret-at-least-32-characters
